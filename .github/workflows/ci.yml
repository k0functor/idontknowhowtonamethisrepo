name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests and validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: Restore FetchContent cache
        uses: actions/cache@v6
        with:
          path: .cache/fetchcontent
          key: ${{ runner.os }}-core-fetchcontent-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}

      - name: Configure dependency-free tests
        run: cmake --preset core-debug

      - name: Build gameplay tests
        run: cmake --build --preset core-debug --parallel 2

      - name: Run CTest suite
        run: ctest --preset core-debug

      - name: Run content validators
        run: cmake --build build/core-tests --target validate_content

      - name: Configure JSON persistence tests
        run: cmake --preset persistence-debug

      - name: Build JSON persistence tests
        run: cmake --build --preset persistence-debug --parallel 2

      - name: Run real save round-trip and recovery tests
        run: ctest --preset persistence-debug

  linux-app:
    name: Full Linux app (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install raylib build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          ninja-build xvfb
          libasound2-dev libgl1-mesa-dev libglu1-mesa-dev
          libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev

      - name: Restore FetchContent cache
        uses: actions/cache@v6
        with:
          path: .cache/fetchcontent
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}

      - name: Configure full app
        run: >-
          cmake -S . -B build/ci-app-${{ matrix.build_type }} -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.cache/fetchcontent
          -DGAME_FORCE_FETCH_RAYLIB=ON
          -DGAME_BUILD_APP=ON
          -DBUILD_TESTING=ON

      - name: Build full app
        run: cmake --build build/ci-app-${{ matrix.build_type }} --parallel 2

      - name: Run tests against full configuration
        run: ctest --test-dir build/ci-app-${{ matrix.build_type }} --output-on-failure

      - name: Smoke-start executable
        run: xvfb-run -a build/ci-app-${{ matrix.build_type }}/bin/i_dont_know_how_to_name_this_game --smoke-test

  windows-package:
    name: Windows portable package
    runs-on: windows-latest
    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v7.0.1

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Restore FetchContent cache
        uses: actions/cache@v6
        with:
          path: .cache/fetchcontent
          key: ${{ runner.os }}-ucrt64-fetchcontent-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}

      - name: Build and validate portable ZIP
        shell: msys2 {0}
        run: pwsh -NoProfile -File tools/package_windows_release.ps1
